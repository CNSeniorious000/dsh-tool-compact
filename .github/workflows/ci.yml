name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.2.1-rc.2
            cordis: 4.0.5
          - dsh: 0.2.2-rc.1
            cordis: 4.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - if: matrix.dsh == '0.2.1-rc.2'
        run: bun install --frozen-lockfile
      - name: Install matching host packages
        if: matrix.dsh != '0.2.1-rc.2'
        env:
          DSH_VERSION: ${{ matrix.dsh }}
          CORDIS_VERSION: ${{ matrix.cordis }}
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); for (const name of Object.keys(p.devDependencies)) if (name.startsWith("@deepseek-ai/dsh-")) p.devDependencies[name] = process.env.DSH_VERSION; p.devDependencies["@deepseek-ai/cordis"] = process.env.CORDIS_VERSION; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")'
          rm bun.lock
          bun install --ignore-scripts
      - run: bun run test
